worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    client_max_body_size 25m;  # audit reports / private keys pasted into forms

    server {
        listen 80;
        server_name _;

        # Anything under /api goes to the backend, untouched (no path
        # rewrite needed — FastAPI already serves everything under /api,
        # see backend/app/main.py). This is what lets the frontend call a
        # relative "/api/..." path from any host/IP/domain with zero CORS
        # involved: browser, proxy, and API all share this one origin.
        location /api/ {
            # ── CORS preflight at the proxy level ───────────────
            # The backend's own CORSMiddleware (see backend/app/main.py)
            # handles ALL CORS headers for actual API responses, including
            # echoing back the exact request origin with credentials
            # support. We do NOT add duplicate CORS headers here because
            # they would collide with the backend's and break the origin
            # match. This OPTIONS handler is only a lightweight safety net
            # so the proxy responds to preflight requests without round-
            # tripping to the backend (and without adding CORS headers
            # that would conflict).
            # Safe to allow all origins for preflight: auth is a Bearer
            # token, never a cookie, so there is zero CSRF risk.
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin "$http_origin" always;
                add_header Access-Control-Allow-Methods "*" always;
                add_header Access-Control-Allow-Headers "*" always;
                add_header Access-Control-Allow-Credentials "true" always;
                add_header Access-Control-Max-Age 86400;
                add_header Content-Length 0;
                add_header Content-Type text/plain;
                return 204;
            }

            proxy_pass http://backend:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Audit runs / report downloads can take a while; don't let the
            # proxy time out requests that are still legitimately working.
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # Everything else goes to the Next.js frontend.
        location / {
            proxy_pass http://frontend:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Next.js dev-mode HMR uses websockets; harmless to keep in prod.
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
