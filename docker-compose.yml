services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: audit
      POSTGRES_PASSWORD: audit
      POSTGRES_DB: audit_saas
    volumes:
      - pgdata:/var/lib/postgresql/data
    # No host port published on purpose: postgres only needs to be reachable
    # from other containers on this compose network, and shouldn't be
    # exposed to the internet on a remote server. Use
    # `docker compose exec postgres psql -U audit -d audit_saas` for
    # one-off access instead of connecting from the host.

  redis:
    image: redis:7
    # Same reasoning as postgres above — internal-only.

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://audit:audit@postgres:5432/audit_saas
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?set a real secret in .env}
      SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY:?set a real Fernet key in .env}
      REPORT_STORAGE_DIR: /data/reports
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
    volumes:
      - report_data:/data/reports
    ports:
      # Exposed directly too (in addition to nginx) for convenience — e.g.
      # hitting http://<host>:8000/docs for the Swagger UI during setup.
      # Safe to expose alongside nginx: auth is a Bearer token, never a
      # cookie, so there's no CSRF surface from also allowing direct access.
      - "8000:8000"
    depends_on:
      - postgres
      - redis

  worker:
    build: ./backend
    command: celery -A app.celery_app.celery_app worker --loglevel=info --concurrency=4
    environment:
      DATABASE_URL: postgresql://audit:audit@postgres:5432/audit_saas
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?set a real secret in .env}
      SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY:?set a real Fernet key in .env}
      REPORT_STORAGE_DIR: /data/reports
    volumes:
      - report_data:/data/reports
    depends_on:
      - postgres
      - redis

  frontend:
    build: ./frontend
    # No NEXT_PUBLIC_API_URL here on purpose — Next.js only reads
    # NEXT_PUBLIC_* at build time, so setting it as a runtime container env
    # var (as this used to do) silently has no effect. The frontend now
    # defaults to a relative "/api" path, which nginx below routes to the
    # backend — works unmodified from localhost, a server IP, or a domain.
    ports:
      - "3000:3000"
    depends_on:
      - backend

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - frontend
      - backend

volumes:
  pgdata:
  report_data:
